name: Probe Eastmoney (TEMP)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner info
        run: |
          echo "=== runner public IP ==="
          curl -s --max-time 15 https://api.ipify.org || echo "ipify failed"
          echo
          node --version
      - name: Fetch 018738 and parse
        run: node probe.js
      - name: GitHub API reachability
        run: |
          echo "=== api.github.com from Actions ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 https://api.github.com
